name: Swift

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Install
      run:  |
        cd env_init
        find "$(dirname "$0")" -type f -name "*.sh" -exec chmod +x {} \;
        cd src
        ./init_all.sh

    - name: Uninstall
      run:  |
        cd env_init
        find "$(dirname "$0")" -type f -name "*.sh" -exec chmod +x {} \;
        cd src
        ./uninstall.sh